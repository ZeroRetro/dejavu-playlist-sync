name: dejavu_music_player
description: "Offline playlist synchronizer and media player for public media archives."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  youtube_explode_dart: 3.1.0
  dio: ^5.4.3+1
  uuid: ^4.4.0
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.19
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  just_audio_platform_interface: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
